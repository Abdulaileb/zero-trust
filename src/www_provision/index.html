<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero Trust Router Setup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel {
      background-color: #ffffff;
      border: 1px solid #d0d4dc;
      border-radius: 4px;
      width: 100%;
      max-width: 420px;
      padding: 24px 28px 28px;
    }
    .panel-header {
      border-bottom: 1px solid #e1e4eb;
      padding-bottom: 12px;
      margin-bottom: 18px;
    }
    .panel-header h1 {
      font-size: 18px;
      color: #333333;
    }
    .panel-header p {
      font-size: 12px;
      color: #777777;
      margin-top: 4px;
    }
    .notice {
      background-color: #fff8e5;
      border: 1px solid #e8d08b;
      color: #7a641f;
      font-size: 12px;
      padding: 8px 10px;
      margin-bottom: 16px;
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 13px;
      color: #444444;
      margin-bottom: 4px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      font-size: 13px;
      padding: 8px 9px;
      border: 1px solid #c3c7cf;
      border-radius: 2px;
    }
    input:focus {
      outline: none;
      border-color: #3b7ddd;
    }
    .actions {
      margin-top: 10px;
    }
    button {
      width: 100%;
      padding: 9px;
      font-size: 13px;
      border: 1px solid #2f65b0;
      background-color: #3b7ddd;
      color: #ffffff;
      border-radius: 2px;
      cursor: pointer;
    }
    .message {
      display: none;
      margin-top: 10px;
      font-size: 12px;
      padding: 7px 9px;
      border-radius: 2px;
      text-align: left;
    }
    .message.error {
      background-color: #f8d7da;
      border: 1px solid #f1a3aa;
      color: #842029;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="panel-header">
      <h1>Zero Trust Router Setup</h1>
      <p>Set the administrator credentials for this device.</p>
    </div>

    <div class="notice">
      WAN access is currently disabled. Create an admin account to complete the initial setup.
    </div>

    <form id="setupForm" action="/cgi-bin/setup" method="POST">
      <div class="form-group">
        <label for="username">Admin username</label>
        <input type="text" id="username" name="username" required minlength="4">
      </div>

      <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required minlength="8">
      </div>

      <div class="form-group">
        <label for="password_confirm">Confirm password</label>
        <input type="password" id="password_confirm" required minlength="8">
      </div>

      <div class="actions">
        <button type="submit">Save & Continue</button>
      </div>

      <div id="message" class="message"></div>
    </form>
  </div>

  <script>
    document.getElementById('setupForm').addEventListener('submit', function (e) {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const conf = document.getElementById('password_confirm').value;
      const msg = document.getElementById('message');

      if (user.length < 4 || /\s/.test(user)) {
        e.preventDefault();
        msg.textContent = 'Username must be at least 4 characters with no spaces.';
        msg.className = 'message error';
        msg.style.display = 'block';
        return;
      }

      if (pass.length < 8) {
        e.preventDefault();
        msg.textContent = 'Password must be at least 8 characters long.';
        msg.className = 'message error';
        msg.style.display = 'block';
        return;
      }

      if (pass !== conf) {
        e.preventDefault();
        msg.textContent = 'Passwords do not match.';
        msg.className = 'message error';
        msg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
