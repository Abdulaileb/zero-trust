events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Standard "Insecure" LAN (Provisioning)
    server {
        listen 80;
        server_name localhost;

        location / {
            root /www_provision;
            index index.html;
        }

        # Proxy CGI requests to the Python logic engine
        location /cgi-bin/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Isolated Management VLAN 99
    server {
        listen 99;
        server_name localhost;

        location / {
            # Check if the zero_trust_complete flag exists
            # In a real environment, this would be a firewall rule.
            # Here, we mimic it by checking the file existence.
            if (!-f /etc/config/zero_trust_complete) {
                return 403 "Forbidden: System Not Provisioned. VLAN 99 Inactive.";
            }

            root /www_trusted;
            index index.html;
        }

        # Proxy CGI requests to the Python logic engine
        location /cgi-bin/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}